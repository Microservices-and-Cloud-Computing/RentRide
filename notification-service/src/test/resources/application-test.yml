spring:
  application:
    name: notification-service-test

  # Mock SMTP — JavaMailSender is replaced by @MockitoBean in tests;
  # these properties just satisfy the auto-configuration binder.
  mail:
    host: localhost
    port: 3025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # Thymeleaf — prefix must match production config (classpath:/templates/email/)
  # so the EmailServiceImpl template resolution path is identical in tests.
  # Cache disabled for fast test iteration.
  thymeleaf:
    prefix: classpath:/templates/email/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  # RabbitMQ — point to localhost for tests; individual tests that mock
  # EmailService directly bypass the AMQP transport layer entirely.
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Disable Eureka so tests can run without a live Service Registry
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# Disable Actuator health checks that require live infrastructure
management:
  health:
    mail:
      enabled: false
    rabbit:
      enabled: false

# Custom mail properties — required for MailProperties @ConfigurationProperties binding
rentride:
  notification:
    mail:
      from-email: no-reply@rentride.com
      sender-name: RentRide Support
