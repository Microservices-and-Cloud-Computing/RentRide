server:
  port: 0

spring:
  application:
    name: rentride-integration-tests

  # ── RabbitMQ Broker Settings ───────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        auto-startup: true
        default-requeue-rejected: false

  # ── Datasource Configuration ───────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:rentride_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# ── JWT Security Properties ──────────────────────────────────────────────────
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:NGRmYmE1ZjQ4M2E4ZjI4ZjM2YTkzMjQ5OTM2NWNlMWQ3OGFmOWY4ZDgyZGMzNzRmOWI0OTFhZmQ=}
      expiration-ms: 86400000

