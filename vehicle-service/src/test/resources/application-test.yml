spring:
  application:
    name: vehicle-service-test

  datasource:
    url: jdbc:h2:mem:rentride_vehicle_testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
