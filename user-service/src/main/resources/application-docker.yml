# Docker environment profile for user-service
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://rentride-postgres:5432/rentride_user_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://service-registry:8761/eureka/}
  instance:
    prefer-ip-address: true
