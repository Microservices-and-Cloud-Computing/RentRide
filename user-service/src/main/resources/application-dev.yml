server:
  port: 8081

spring:
  application:
    name: user-service

  # ── Embedded H2 DataSource for local development without PostgreSQL ───────
  datasource:
    url: jdbc:h2:mem:rentride_user_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # ── JPA / Hibernate ──────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# ── Disable Eureka client during standalone local development ──────────────
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
